    <!-- Content Security Policy -->
    <!-- script-src 用内联脚本的 sha256 摘要取代 'unsafe-inline'，并去掉 'unsafe-eval'：
         产物里唯一的 eval 类调用是 lodash 的 `Function("return this")()`，
         浏览器中会被 `self` 短路、永不执行，因此两者都不再需要。
         若日后新增或修改页头内联脚本，需重新计算摘要。
         最省事的取值方式：故意写一个错的 sha256，Chrome 控制台会直接打印出正确的那个值（HTML 流程会把 CRLF 预归一为 LF，所以别对原始文件直接算）。 -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-SyH9JnG8RNjMIezewqDaENLlO3XJln7zJX7P+asXBcU='; style-src 'self' 'unsafe-inline' https://s1.hdslb.com https://cdn.imsyy.top; img-src 'self' data: https: blob:; font-src 'self' data: https://s1.hdslb.com https://cdn.imsyy.top; connect-src 'self' https://uapis.cn https://v1.hitokoto.cn https://restapi.amap.com https://wttr.in https://ipinfo.io https://ipapi.co https://163api.mmcoo.de https://api-meting.imsyy.top https://api.wuenci.com https://*.music.163.com https://*.music.126.net https://*.qq.com https://*.qqmusic.qq.com; media-src 'self' https: blob:; worker-src 'self' blob:; frame-src 'none'; object-src 'none'; base-uri 'self';">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="%VITE_SITE_LOGO%" />
