server {
    listen 12445;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 单页应用回退：未命中的路径回到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存，保证发版后 Service Worker 能及时检查到更新
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # PWA 文件：MIME 必须正确，且不可缓存，否则站点更新后 sw 会长期停留在旧版本
    location = /sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache";
    }
    location = /registerSW.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }
    location = /workbox-*.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache";
    }

    # 带 hash 的静态资源：内容不变，可长缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 图片 / 字体 / 视频：文件名固定不带 hash，用较长但可过期的缓存
    location /images/ {
        add_header Cache-Control "public, max-age=604800";
    }
    location /font/ {
        add_header Cache-Control "public, max-age=604800";
    }
    location /videos/ {
        add_header Cache-Control "public, max-age=604800";
    }

    # gzip 静态压缩（vite-plugin-compression 已产出 .gz，直接复用）
    gzip_static on;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    # 50x 页面兜底
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
